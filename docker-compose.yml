name: transaction-platform
networks:
  transaction-network:
    driver: bridge
volumes:
  kafka-data:
  postgres-data:
  grafana-data:
  spark-checkpoints:
services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: tp-kafka
    networks: [transaction-network]
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15

  postgres:
    image: postgres:17-alpine
    container_name: tp-postgres
    networks: [transaction-network]
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transactions}
      POSTGRES_USER: ${POSTGRES_USER:-transactions}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transactions_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transactions} -d ${POSTGRES_DB:-transactions}"]
      interval: 5s
      timeout: 5s
      retries: 20

  spark-master:
    image: apache/spark:4.0.1
    container_name: tp-spark-master
    networks: [transaction-network]
    command: ["/opt/spark/bin/spark-class","org.apache.spark.deploy.master.Master","--host","spark-master","--port","7077","--webui-port","8081"]
    ports: ["7077:7077","8081:8081"]

  spark-worker-1:
    image: apache/spark:4.0.1
    container_name: tp-spark-worker-1
    networks: [transaction-network]
    depends_on: [spark-master]
    command: ["/opt/spark/bin/spark-class","org.apache.spark.deploy.worker.Worker","spark://spark-master:7077","--cores","2","--memory","2g","--webui-port","8082"]
    ports: ["8082:8082"]

  spark-worker-2:
    image: apache/spark:4.0.1
    container_name: tp-spark-worker-2
    networks: [transaction-network]
    depends_on: [spark-master]
    command: ["/opt/spark/bin/spark-class","org.apache.spark.deploy.worker.Worker","spark://spark-master:7077","--cores","2","--memory","2g","--webui-port","8083"]
    ports: ["8083:8083"]

  spark-job:
    build: ./spark
    container_name: tp-spark-job
    networks: [transaction-network]
    depends_on:
      kafka: {condition: service_healthy}
      spark-master: {condition: service_started}
      spark-worker-1: {condition: service_started}
      spark-worker-2: {condition: service_started}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RAW_TOPIC: ${RAW_TOPIC:-transactions.raw}
      AGGREGATED_TOPIC: ${AGGREGATED_TOPIC:-transactions.aggregated}
      SPARK_MASTER: spark://spark-master:7077
      CHECKPOINT_DIR: /checkpoints/aggregation
    volumes: [spark-checkpoints:/checkpoints]
    restart: unless-stopped

  simulator-api:
    build: ./simulator/backend
    container_name: tp-simulator-api
    networks: [transaction-network]
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_KAFKA_RAW_TOPIC: ${RAW_TOPIC:-transactions.raw}
    ports: ["8080:8080"]
    restart: unless-stopped

  simulator-ui:
    build: ./simulator/frontend
    container_name: tp-simulator-ui
    networks: [transaction-network]
    depends_on: [simulator-api]
    ports: ["3000:80"]
    restart: unless-stopped

  transaction-consumer:
    build: ./transaction-consumer
    container_name: tp-transaction-consumer
    networks: [transaction-network]
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_KAFKA_AGGREGATED_TOPIC: ${AGGREGATED_TOPIC:-transactions.aggregated}
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-transactions}
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER:-transactions}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:-transactions_dev_password}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: tp-grafana
    networks: [transaction-network]
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
